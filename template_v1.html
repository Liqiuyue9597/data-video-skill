<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>认知革命 · The Cognitive Revolution</title>
<style>
  :root{
    --bg:#0a0a0f;
    --fg:#eceae4;
    --dim:#8a8a90;
    --gold:#d4a85a;
    --red:#c15b4e;
    --blue:#5aa0d4;
    --serif:'EB Garamond','Playfair Display','Noto Serif SC',Georgia,serif;
    --sans:'Inter','Helvetica Neue','PingFang SC','Noto Sans SC',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;cursor:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---- chapter label (top-left) ---- */
  .chapter{
    position:absolute;top:5.5%;left:6%;
    font-family:var(--sans);letter-spacing:.3em;font-weight:300;
    font-size:1.1rem;color:var(--dim);
    opacity:0;transition:opacity 1.2s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  .chapter.on{opacity:1}

  /* ---- credit (top-right) ---- */
  .credit{
    position:absolute;top:5.5%;right:6%;
    font-family:var(--sans);font-weight:300;
    font-size:1.1rem;color:var(--dim);letter-spacing:.15em;
    opacity:0;transition:opacity 1.6s cubic-bezier(.4,0,.2,1);
  }
  .credit.on{opacity:.85}

  /* ---- centerpiece big number / headline ---- */
  .headline{
    position:absolute;left:0;right:0;
    text-align:center;font-family:var(--serif);
    opacity:0;transform:translateY(14px);
    transition:opacity 1.4s cubic-bezier(.4,0,.2,1),transform 1.4s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  .headline.on{opacity:1;transform:translateY(0)}

  /* ---- bottom subtitle (narration line) ---- */
  .sub{
    position:absolute;left:8%;right:8%;bottom:10%;
    text-align:center;
    font-family:var(--sans);font-size:1.15rem;letter-spacing:.08em;
    color:var(--fg);font-weight:300;
    opacity:0;transform:translateY(8px);
    transition:opacity 1s cubic-bezier(.4,0,.2,1),transform 1s cubic-bezier(.4,0,.2,1);
    text-shadow:0 0 20px rgba(0,0,0,.9);
    pointer-events:none;
  }
  .sub.on{opacity:.95;transform:translateY(0)}
  .sub em{font-family:var(--sans);font-style:normal;color:var(--gold);font-weight:400}
  .sub b{color:var(--gold);font-weight:500}

  /* ---- source citation (bottom-left) ---- */
  .cite{
    position:absolute;left:6%;bottom:16%;
    font-family:var(--sans);font-weight:300;letter-spacing:.1em;
    font-size:1rem;color:var(--dim);opacity:0;
    transition:opacity 1.2s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  .cite.on{opacity:.75}

  /* ---- opening / closing full-screen text ---- */
  .mega{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:1.2em;padding:0 10%;text-align:center;
    opacity:0;transition:opacity 1.6s cubic-bezier(.4,0,.2,1);pointer-events:none;
  }
  .mega.on{opacity:1}
  .mega .line{
    font-family:var(--sans);font-weight:300;font-size:1.9rem;letter-spacing:.1em;line-height:1.6;
  }
  .mega .line em{font-family:var(--sans);font-style:normal;color:var(--gold);font-weight:400}

  /* ---- big centered stats (e.g. 99% → 99.9%) ---- */
  .stat{
    display:inline-block;margin:0 .5em;font-family:var(--serif);
  }
  .stat .num{font-size:4.5rem;color:var(--fg);letter-spacing:.02em}
  .stat .num.gold{color:var(--gold)}
  .stat .lbl{display:block;font-family:var(--sans);font-size:1rem;
             color:var(--dim);letter-spacing:.3em;text-transform:uppercase;margin-top:.4em}

  /* progress bar at very bottom, barely visible */
  #progress{
    position:absolute;left:0;right:0;bottom:0;height:1px;
    background:rgba(255,255,255,.05);
  }
  #progress .fill{height:100%;width:0%;background:var(--gold);opacity:.35;transition:width .2s linear}

  /* play overlay */
  #play{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(10,10,15,.92);z-index:100;cursor:pointer;
    font-family:var(--serif);font-style:italic;color:var(--dim);letter-spacing:.3em;
    font-size:.9rem;text-transform:uppercase;
    transition:opacity .8s;
  }
  #play.hidden{opacity:0;pointer-events:none}
  #play .btn{
    width:120px;height:120px;border:1px solid var(--dim);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:1.5em;transition:all .4s;
  }
  #play:hover .btn{border-color:var(--gold);transform:scale(1.05)}
  #play .btn::after{
    content:'';border-style:solid;border-width:14px 0 14px 22px;
    border-color:transparent transparent transparent var(--dim);
    margin-left:6px;transition:border-color .4s;
  }
  #play:hover .btn::after{border-left-color:var(--gold)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <!-- UI layers -->
  <div id="chapter" class="chapter"></div>
  <div id="credit" class="credit">原文 · Konstantine</div>
  <div id="headline" class="headline"></div>
  <div id="sub" class="sub"></div>
  <div id="cite" class="cite"></div>
  <div id="mega" class="mega"><div class="line" id="megaLine"></div></div>

  <div id="progress"><div class="fill" id="pfill"></div></div>

  <div id="play">
    <div class="btn"></div>
    <div>Press to begin · 点击开始</div>
  </div>
</div>

<script>
// =============================================================
// particle field — tatakye-style "data landscape"
// =============================================================
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
// scale canvas text relative to viewport width (baseline: 1920px wide)
function fontPx(sizeAt1920){
  const scale = Math.max(0.75, Math.min(1.6, W/1920));
  return Math.round(sizeAt1920 * scale);
}
function resize(){
  W=cv.clientWidth=window.innerWidth;
  H=cv.clientHeight=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();

// Build a grid of particles in 3D space, projected to 2D.
const GRID_X=120, GRID_Z=36;
const particles=[];
for(let z=0;z<GRID_Z;z++){
  for(let x=0;x<GRID_X;x++){
    const u=(x/(GRID_X-1))-0.5;         // -0.5 .. 0.5
    const v=(z/(GRID_Z-1));              // 0 .. 1 (near -> far)
    particles.push({
      u,v,
      jitter:(Math.random()-.5)*.6,
      phase:Math.random()*Math.PI*2,
      ampSeed:Math.random(),
    });
  }
}

// camera / scene parameters, animated by scenes
const scene={
  mode:'field',           // 'field' | 'curve' | 'collapse' | 'jenny' | 'timebar' | 'dark'
  camY:0.55,              // vertical camera position (0..1)
  camDist:1.0,            // scale
  waveAmp:0.0,            // vertical wave on the field
  waveSpeed:0.6,
  curveT:0,               // 0..1 for the two rising curves
  secondCurve:0,          // 0..1 fade in of cognitive curve
  priceT:0,               // 0..1 for the collapsing price line
  codeStream:0,           // 0..1 code-rain intensity
  chessT:0,               // 0..1 piece drop / shatter
  tint:'#eceae4',
  goldPulse:0,
  blackout:0,             // 0..1 full-screen blackout overlay (scene transitions)
};

// Helper: trigger a blink transition — fade to black, run cb at peak, fade back.
function sceneBlink(cb, {dark=0.45, hold=0.08, light=0.5}={}){
  tween('blackout', 0, 1, dark);
  setTimeout(()=>{
    try{cb && cb();}catch(e){console.error(e);}
    tween('blackout', 1, 0, light);
  }, (dark+hold)*1000);
}

// pre-rendered code lines for the "AI coding" scene
const CODE_LINES=[
  "if (price → 0) demand.explode();",
  "for prompt in curiosities: team.spawn();",
  "model.predict(futures).select(best);",
  "while (humans.direct()) agents.execute();",
  "99.9% ← machines.cognition",
  "const engineer = supervisor;",
  "p = E[mx]",
  "externalize(mind);",
];
const codeDrops=[];
for(let i=0;i<60;i++){
  codeDrops.push({
    x:Math.random(),
    y:Math.random()*2-1,
    speed:.08+Math.random()*.18,
    text:CODE_LINES[(Math.random()*CODE_LINES.length)|0],
    alpha:.1+Math.random()*.5,
  });
}

let t0=0;
function draw(ts){
  if(!t0)t0=ts;
  const t=(ts-t0)/1000;
  ctx.fillStyle='#0a0a0f';
  ctx.fillRect(0,0,W,H);

  // vignette
  const grad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.75);
  grad.addColorStop(0,'rgba(10,10,15,0)');
  grad.addColorStop(1,'rgba(0,0,0,.85)');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  const cx=W/2, horizon=H*scene.camY;
  // very slow camera breathing — subtle parallax
  const camBreath = Math.sin(t*0.14) * 6;
  const camSway   = Math.sin(t*0.09) * 4;

  // ============ PARTICLE FIELD ============
  if(scene.mode==='field'){
    for(const p of particles){
      // perspective: far rows (v near 1) are near horizon
      const depth=1-p.v;                       // 1 (far) -> 0 (near)
      const scaleY=1 - Math.pow(1-depth,2)*.95;
      const y = horizon + (H*0.55)*(1-depth) + camBreath*(1-depth);
      const xSpread = W*(0.55 - depth*0.45);
      const x = cx + p.u*xSpread*2 + p.jitter*(1-depth)*8 + camSway*(1-depth);

      // wave animation
      const wave=Math.sin(t*scene.waveSpeed + p.phase + p.u*6)*scene.waveAmp*(1-depth)*40;

      const size=.9 + depth*1.3;
      const alpha=0.15 + depth*0.75;

      ctx.fillStyle=`rgba(236,234,228,${alpha})`;
      ctx.fillRect(x-size/2, y+wave-size/2, size, size);
    }
  }

  // ============ RISING CURVES (physical + cognitive) ============
  if(scene.mode==='curve'){
    const left=W*.12, right=W*.88;
    const baseY=H*.78, topY=H*.28;
    // x-axis
    ctx.strokeStyle='rgba(236,234,228,.15)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(left,baseY);ctx.lineTo(right,baseY);ctx.stroke();

    // time ticks: four narrative anchors instead of 1700→2000
    const ticks=[
      {u:0.00,label:'1700'},
      {u:0.33,label:'1900'},
      {u:0.66,label:'现在'},
      {u:1.00,label:'未来 →'},
    ];
    ctx.fillStyle='rgba(236,234,228,.55)';
    ctx.font=`300 ${fontPx(17)}px -apple-system, BlinkMacSystemFont, sans-serif`;
    ctx.textAlign='center';
    for(const tk of ticks){
      const x=left+(right-left)*tk.u;
      ctx.strokeStyle='rgba(236,234,228,.15)';
      ctx.beginPath();ctx.moveTo(x,baseY);ctx.lineTo(x,baseY+8);ctx.stroke();
      ctx.fillText(tk.label, x, baseY+28);
    }

    // y-axis label (right side) — Chinese only, no italics
    ctx.textAlign='left';
    ctx.fillStyle='rgba(236,234,228,.5)';
    ctx.font=`300 ${fontPx(17)}px -apple-system, "PingFang SC", "Noto Sans SC", sans-serif`;
    ctx.fillText('← 由人完成', right+14, baseY-2);
    ctx.fillText('← 由机器完成', right+14, topY+10);
    ctx.textAlign='center';

    // physical curve: starts rising at ~1800 (u=0.28), near-top by "现在"
    drawCurve(left,right,baseY,topY,scene.curveT,0.28,'#eceae4',1.6, 2.0);
    // physical curve end-label — Chinese only
    if(scene.curveT>0.75){
      const alpha=Math.min(1,(scene.curveT-0.75)*4);
      ctx.fillStyle=`rgba(236,234,228,${alpha*.9})`;
      ctx.font=`300 ${fontPx(19)}px -apple-system, "PingFang SC", "Noto Sans SC", sans-serif`;
      ctx.textAlign='right';
      ctx.fillText('体力', left+(right-left)*scene.curveT - 10, topY+36);
    }
    // cognitive curve: starts rising at ~"现在" (u=0.60), much steeper
    if(scene.secondCurve>0){
      drawCurve(left,right,baseY,topY-25,scene.secondCurve,0.60,'#d4a85a',2, 1.6);
      if(scene.secondCurve>0.5){
        const alpha=Math.min(1,(scene.secondCurve-0.5)*2);
        ctx.fillStyle=`rgba(212,168,90,${alpha})`;
        ctx.font=`400 ${fontPx(19)}px -apple-system, "PingFang SC", "Noto Sans SC", sans-serif`;
        ctx.textAlign='right';
        ctx.fillText('认知', left+(right-left)*scene.secondCurve - 10, topY-46);
      }
    }
    ctx.textAlign='left';
  }

  // ============ COLLAPSING PRICE ============
  if(scene.mode==='collapse'){
    const left=W*.12, right=W*.88;
    const topY=H*.3, botY=H*.78;
    ctx.strokeStyle='rgba(236,234,228,.15)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(left,botY);ctx.lineTo(right,botY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(left,topY);ctx.lineTo(left,botY);ctx.stroke();

    // y-axis label (price) — vertical, Chinese only, no italics
    ctx.save();
    ctx.translate(left-32, (topY+botY)/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillStyle='rgba(236,234,228,.6)';
    ctx.font=`300 ${fontPx(19)}px -apple-system, "PingFang SC", "Noto Sans SC", sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('认知的价格', 0, 0);
    ctx.restore();

    // y-axis ticks
    ctx.textAlign='right';
    ctx.fillStyle='rgba(236,234,228,.6)';
    ctx.font=`300 ${fontPx(17)}px -apple-system, sans-serif`;
    ctx.fillText('100%', left-12, topY+6);
    ctx.fillText('0', left-12, botY+6);

    // x-axis label — Chinese only
    ctx.textAlign='center';
    ctx.font=`300 ${fontPx(17)}px -apple-system, "PingFang SC", "Noto Sans SC", sans-serif`;
    ctx.fillText('时间 →', (left+right)/2, botY+30);

    // area fill under the curve — "value draining"
    const segs=160;
    ctx.beginPath();
    ctx.moveTo(left, botY);
    for(let i=0;i<=segs*scene.priceT;i++){
      const u=i/segs;
      const x=left+(right-left)*u;
      const y=topY+(botY-topY)*(1-Math.exp(-u*4.5));
      ctx.lineTo(x,y);
    }
    const headU0=scene.priceT;
    ctx.lineTo(left+(right-left)*headU0, botY);
    ctx.closePath();
    const areaGrad = ctx.createLinearGradient(0, topY, 0, botY);
    areaGrad.addColorStop(0, 'rgba(212,168,90,.18)');
    areaGrad.addColorStop(1, 'rgba(212,168,90,0)');
    ctx.fillStyle = areaGrad;
    ctx.fill();

    // dropping curve on top of fill
    ctx.beginPath();
    ctx.strokeStyle='#d4a85a';
    ctx.lineWidth=2.4;
    for(let i=0;i<=segs*scene.priceT;i++){
      const u=i/segs;
      const x=left+(right-left)*u;
      const y=topY+(botY-topY)*(1-Math.exp(-u*4.5));
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();

    // glow at head with pulse
    const headU=scene.priceT;
    const hx=left+(right-left)*headU;
    const hy=topY+(botY-topY)*(1-Math.exp(-headU*4.5));
    const pulse = 0.6 + Math.sin(t*2.4)*0.4;
    ctx.fillStyle='rgba(212,168,90,.95)';
    ctx.beginPath();ctx.arc(hx,hy, 3 + pulse*1.4, 0, Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(212,168,90,.2)';
    ctx.beginPath();ctx.arc(hx,hy, 14 + pulse*6, 0, Math.PI*2);ctx.fill();
    ctx.textAlign='left';
  }

  // ============ SPINNING JENNY — rotating radial threads ============
  if(scene.mode==='jenny'){
    const cx2=W*.5, cy2=H*.55;
    const r=Math.min(W,H)*.22;
    const n=80;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2 + t*0.4;
      const inner=r*.15;
      const outer=r*(.6+Math.sin(t*1.3+i)*.35);
      const x1=cx2+Math.cos(a)*inner;
      const y1=cy2+Math.sin(a)*inner;
      const x2=cx2+Math.cos(a)*outer;
      const y2=cy2+Math.sin(a)*outer;
      ctx.strokeStyle=`rgba(236,234,228,${.08+(i%8===0?.3:0)})`;
      ctx.lineWidth=i%8===0?1.2:.6;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
    // hub
    ctx.fillStyle='rgba(212,168,90,.6)';
    ctx.beginPath();ctx.arc(cx2,cy2,3,0,Math.PI*2);ctx.fill();
  }

  // ============ CODE STREAM ============
  if(scene.codeStream>0){
    ctx.font='400 11px ui-monospace,SF Mono,Menlo,monospace';
    for(const d of codeDrops){
      d.y += d.speed*0.016;
      if(d.y>1.1){d.y=-0.15;d.text=CODE_LINES[(Math.random()*CODE_LINES.length)|0]}
      const alpha=d.alpha*scene.codeStream*(d.y>0&&d.y<1?1:0);
      ctx.fillStyle=`rgba(236,234,228,${alpha})`;
      ctx.fillText(d.text, d.x*W, d.y*H);
    }
  }

  // ============ TIME BARS (40 vs 5 years) ============
  if(scene.mode==='timebar'){
    const cx2=W*.5, cy2=H*.55;
    const maxW=W*.55;
    const barH=22, gap=110;

    const t40 = Math.min(1, scene.chessT*1.4);
    const t5  = Math.max(0, Math.min(1, (scene.chessT-0.5)*2));

    // top bar — 40 years
    const w40 = maxW * t40;
    ctx.fillStyle='rgba(236,234,228,.9)';
    ctx.fillRect(cx2 - maxW/2, cy2 - gap/2 - barH/2, w40, barH);
    if(t40>0.3){
      const a=Math.min(1,(t40-0.3)*2);
      ctx.fillStyle=`rgba(236,234,228,${a*.75})`;
      ctx.font=`300 ${fontPx(19)}px -apple-system, "PingFang SC", "Noto Sans SC", sans-serif`;ctx.textAlign='left';
      ctx.fillText('工业革命 · 40 年', cx2 - maxW/2, cy2 - gap/2 - barH/2 - 14);
      ctx.font=`400 ${fontPx(38)}px -apple-system, "PingFang SC", "Noto Sans SC", sans-serif`;
      ctx.fillStyle=`rgba(236,234,228,${a})`;
      ctx.textAlign='left';
      ctx.fillText('40 年', cx2 - maxW/2 + w40 + 18, cy2 - gap/2 + 10);
    }

    // bottom bar — 5 years (only 1/8 as long)
    const w5 = (maxW * (5/40)) * t5;
    ctx.fillStyle='rgba(212,168,90,.95)';
    ctx.fillRect(cx2 - maxW/2, cy2 + gap/2 - barH/2, w5, barH);
    if(t5>0.1){
      const a=Math.min(1,(t5-0.1)*2);
      ctx.fillStyle=`rgba(212,168,90,${a*.9})`;
      ctx.font=`300 ${fontPx(19)}px -apple-system, "PingFang SC", "Noto Sans SC", sans-serif`;ctx.textAlign='left';
      ctx.fillText('认知革命 · ?', cx2 - maxW/2, cy2 + gap/2 - barH/2 - 14);
      ctx.font=`400 ${fontPx(38)}px -apple-system, "PingFang SC", "Noto Sans SC", sans-serif`;
      ctx.fillStyle=`rgba(212,168,90,${a})`;
      ctx.fillText('5 年', cx2 - maxW/2 + w5 + 18, cy2 + gap/2 + 10);
    }

    // dashed scale under bars
    ctx.strokeStyle='rgba(236,234,228,.1)';
    ctx.setLineDash([3,4]);
    ctx.beginPath();
    ctx.moveTo(cx2 - maxW/2, cy2 + gap/2 + 48);
    ctx.lineTo(cx2 + maxW/2, cy2 + gap/2 + 48);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign='left';
  }

  // ============ blackout overlay for scene transitions ============
  if(scene.blackout>0){
    ctx.fillStyle=`rgba(10,10,15,${scene.blackout})`;
    ctx.fillRect(0,0,W,H);
  }

  // ============ progress bar ============
  pfill.style.width=(elapsed()/TOTAL*100)+'%';

  requestAnimationFrame(draw);
}
function drawCurve(left,right,baseY,topY,progress,flatUntil,color,width,exp){
  const expP = exp || 2.2;
  const segs=200;
  ctx.beginPath();
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  for(let i=0;i<=segs*progress;i++){
    const u=i/segs;
    const x=left+(right-left)*u;
    let y;
    if(u<flatUntil){
      y=baseY-2;
    }else{
      const k=(u-flatUntil)/(1-flatUntil); // 0..1
      y=baseY-(baseY-topY)*Math.pow(k,expP);
    }
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  // head position
  const u=progress;
  const x=left+(right-left)*u;
  let y;
  if(u<flatUntil){y=baseY-2;}
  else{const k=(u-flatUntil)/(1-flatUntil);y=baseY-(baseY-topY)*Math.pow(k,expP);}

  // breathing pulse at head
  const tNow = performance.now()/1000;
  const pulse = 0.6 + Math.sin(tNow*2.4)*0.4;
  ctx.fillStyle = color + 'ee';
  ctx.beginPath();ctx.arc(x,y,3 + pulse*1.4, 0, Math.PI*2);ctx.fill();
  // soft glow
  ctx.fillStyle = color + '33';
  ctx.beginPath();ctx.arc(x,y, 10 + pulse*8, 0, Math.PI*2);ctx.fill();

  // dashed guide lines once curve nearly complete
  if(progress>0.92){
    const a = Math.min(1,(progress-0.92)*20)*0.35;
    ctx.save();
    ctx.strokeStyle = color + 'aa';
    ctx.setLineDash([3,5]);
    ctx.lineWidth = 1;
    ctx.globalAlpha = a;
    // vertical from head to x-axis
    ctx.beginPath();ctx.moveTo(x, y);ctx.lineTo(x, baseY);ctx.stroke();
    ctx.restore();
  }
}

// Count-up: for every <span class="count" data-to="X" data-prefix="" data-suffix=""> inside root,
// animate the number from 0 to X over ~1.1s with ease-out.
function runCountUp(root){
  const els = root.querySelectorAll('.count');
  for(const el of els){
    const to = parseFloat(el.dataset.to||'0');
    const dec = parseInt(el.dataset.dec||'0');
    const prefix = el.dataset.prefix||'';
    const suffix = el.dataset.suffix||'';
    const dur = parseFloat(el.dataset.dur||'1.1')*1000;
    const start = performance.now();
    function step(now){
      const k = Math.min(1, (now-start)/dur);
      const eased = 1 - Math.pow(1-k, 3);  // easeOutCubic
      const v = to * eased;
      el.textContent = prefix + v.toFixed(dec) + suffix;
      if(k<1) requestAnimationFrame(step);
      else el.textContent = prefix + to.toFixed(dec) + suffix;
    }
    requestAnimationFrame(step);
  }
}

// --- tween helper (linear) ---
const tweens=[];
function tween(key,from,to,durSec){
  tweens.push({key,from,to,dur:durSec,start:elapsed()});
}
function updateTweens(){
  const now=elapsed();
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];
    const k=Math.min(1,(now-tw.start)/tw.dur);
    const eased = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2; // easeInOutQuad
    scene[tw.key] = tw.from + (tw.to-tw.from)*eased;
    if(k>=1)tweens.splice(i,1);
  }
}

const SPEED=1.3; // 全局速度倍率：>1 更快，<1 更慢

function elapsed(){return startAt==null?0:((performance.now()-startAt)/1000)*SPEED;}
let cueIdx=0;
function tick(){
  if(startAt!=null){
    updateTweens();
    const e=elapsed();
    while(cueIdx<cues.length && cues[cueIdx][0]<=e){
      try{cues[cueIdx][1]();}catch(err){console.error(err);}
      cueIdx++;
    }
    if(e>=TOTAL+1){/*loop end — stay on closing*/}
  }
  requestAnimationFrame(tick);
}

// =============================================================
// AMBIENT SOUNDTRACK — Web Audio, generated live
// Tatakye-style: minimal low end, airy pad, bell-like multi-note chime
// =============================================================
let audio={ctx:null,master:null,layers:{},reverb:null};
function initAudio(){
  if(audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  const master = ctx.createGain();
  master.gain.value = 0.0;

  // --- master filter chain: HPF kills low mud, LP keeps airy ---
  const hpf = ctx.createBiquadFilter();
  hpf.type='highpass'; hpf.frequency.value=160; hpf.Q.value=.6;
  const lp = ctx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=6000; lp.Q.value=.4;
  master.connect(hpf).connect(lp).connect(ctx.destination);

  // --- synthetic reverb (convolver with exponential-decay noise IR) ---
  const convolver = ctx.createConvolver();
  const irLen = ctx.sampleRate * 2.6;
  const irBuf = ctx.createBuffer(2, irLen, ctx.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = irBuf.getChannelData(ch);
    for(let i=0;i<irLen;i++){
      const t = i/irLen;
      // early reflections concentrated near start, long tail
      d[i] = (Math.random()*2-1) * Math.pow(1-t, 2.8) * (1 + Math.sin(t*40)*.15);
    }
  }
  convolver.buffer = irBuf;
  const revSend = ctx.createGain(); revSend.gain.value=.55;
  const revReturn = ctx.createGain(); revReturn.gain.value=.9;
  revSend.connect(convolver).connect(revReturn).connect(master);
  audio.reverb = revSend;
  audio.ctx = ctx;
  audio.master = master;

  // --- LAYER 1: airy pad (Am7, high octave only, no low) ---
  const padGain = ctx.createGain(); padGain.gain.value=0;
  const padFilt = ctx.createBiquadFilter();
  padFilt.type='lowpass'; padFilt.frequency.value=1800; padFilt.Q.value=.9;
  padGain.connect(padFilt).connect(master);
  padGain.connect(revSend); // pad also feeds reverb
  const chord = [220, 261.63, 329.63, 392]; // A3 C4 E4 G4
  for(const f of chord){
    const o1=ctx.createOscillator(); o1.type='triangle'; o1.frequency.value=f;
    const o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.value=f*1.005;
    const g=ctx.createGain(); g.gain.value=.16/chord.length;
    o1.connect(g); o2.connect(g); g.connect(padGain);
    const lfo=ctx.createOscillator(); lfo.frequency.value=.09+Math.random()*.05;
    const lfoG=ctx.createGain(); lfoG.gain.value=200;
    lfo.connect(lfoG).connect(padFilt.frequency);
    o1.start(); o2.start(); lfo.start();
  }

  // --- LAYER 2: shimmer (high-filtered noise, swelling) ---
  const shimmerGain = ctx.createGain(); shimmerGain.gain.value=0;
  shimmerGain.connect(master);
  const buf = ctx.createBuffer(1, ctx.sampleRate*4, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*0.35;
  const noise = ctx.createBufferSource(); noise.buffer=buf; noise.loop=true;
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=4500; hp.Q.value=2;
  const sweep = ctx.createOscillator(); sweep.frequency.value=.07;
  const sweepG = ctx.createGain(); sweepG.gain.value=1200;
  sweep.connect(sweepG).connect(hp.frequency);
  noise.connect(hp).connect(shimmerGain);
  noise.start(); sweep.start();

  audio.layers = {padGain, shimmerGain};
}

function fadeTo(gainNode, target, durSec){
  if(!audio.ctx) return;
  const now = audio.ctx.currentTime;
  gainNode.gain.cancelScheduledValues(now);
  gainNode.gain.setValueAtTime(gainNode.gain.value, now);
  gainNode.gain.linearRampToValueAtTime(target, now+durSec);
}

// --- BELL VOICE: a single inharmonic bell-like note ---
// `timbre` picks a different partial family for variety.
function bellNote(freq, {t=0, gain=.1, dur=2.4, timbre='bell'}={}){
  if(!audio.ctx) return;
  const ctx = audio.ctx;
  const startT = ctx.currentTime + t;
  // Partial libraries — different timbres have different inharmonic profiles.
  const TIMBRES = {
    bell:   [ // glass bell — bright, metallic
      {r:1.0,  amp:1.00, decay:1.00},
      {r:2.01, amp:0.55, decay:0.60},
      {r:3.03, amp:0.32, decay:0.40},
      {r:4.95, amp:0.18, decay:0.28},
      {r:7.10, amp:0.08, decay:0.18},
    ],
    glass:  [ // soft glass — fewer high partials, airy
      {r:1.0,  amp:1.00, decay:1.00},
      {r:2.76, amp:0.40, decay:0.50},
      {r:5.40, amp:0.14, decay:0.25},
    ],
    marimba: [ // marimba — fundamental + odd harmonic
      {r:1.0,  amp:1.00, decay:1.00},
      {r:3.0,  amp:0.35, decay:0.45},
      {r:6.0,  amp:0.10, decay:0.20},
    ],
    tine:   [ // Rhodes-like tine, close to musical
      {r:1.0,  amp:1.00, decay:1.00},
      {r:2.0,  amp:0.50, decay:0.65},
      {r:4.0,  amp:0.20, decay:0.35},
      {r:6.0,  amp:0.08, decay:0.20},
    ],
    pluck:  [ // short soft pluck
      {r:1.0,  amp:1.00, decay:0.70},
      {r:2.01, amp:0.65, decay:0.50},
      {r:3.00, amp:0.40, decay:0.30},
    ],
  };
  const partials = TIMBRES[timbre] || TIMBRES.bell;
  const voice = ctx.createGain();
  voice.gain.value = 1;
  voice.connect(audio.master);
  voice.connect(audio.reverb);
  for(const p of partials){
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq * p.r;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, startT);
    g.gain.linearRampToValueAtTime(gain * p.amp, startT + .008);
    g.gain.exponentialRampToValueAtTime(.0001, startT + dur * p.decay);
    o.connect(g).connect(voice);
    o.start(startT);
    o.stop(startT + dur * p.decay + .1);
  }
}

// --- NOISE SWEEP: short filtered noise burst, like a pencil-on-paper or wind ---
function noiseSweep({t=0, gain=.06, dur=.4, fStart=3000, fEnd=800}={}){
  if(!audio.ctx) return;
  const ctx = audio.ctx;
  const startT = ctx.currentTime + t;
  const bufLen = Math.floor(ctx.sampleRate * (dur + .05));
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<bufLen;i++) d[i] = (Math.random()*2-1);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.Q.value = 3;
  bp.frequency.setValueAtTime(fStart, startT);
  bp.frequency.exponentialRampToValueAtTime(fEnd, startT + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, startT);
  g.gain.linearRampToValueAtTime(gain, startT + .01);
  g.gain.exponentialRampToValueAtTime(.0001, startT + dur);
  src.connect(bp).connect(g).connect(audio.master);
  g.connect(audio.reverb);
  src.start(startT);
  src.stop(startT + dur + .1);
}

// --- CHORD CHIME: multiple bell voices stacked, variant shapes mood ---
function chimeHit(variant='soft'){
  if(!audio.ctx) return;
  // Pentatonic A minor pool
  const A4=440, C5=523.25, D5=587.33, E5=659.25, G5=783.99, A5=880, C6=1046.5, D6=1174.66, E6=1318.5, G6=1568;
  const A3=220, C4=261.63, E4=329.63, G4=392;

  switch(variant){
    case 'soft': { // ← subtitle: 6 random pattern templates for variety
      const TIMBRES = ['bell','glass','marimba','tine','pluck'];
      const T = () => TIMBRES[(Math.random()*TIMBRES.length)|0];
      // Pool of random note combinations (always A-minor-pentatonic)
      const highs = [E5,G5,A5,C6,D6];
      const mids  = [C5,D5,E5,G5];
      const tops  = [A5,C6,D6,E6];

      // pick one of 6 patterns
      const pattern = (Math.random()*6)|0;
      switch(pattern){
        case 0: // single bell → sparse
          bellNote(pick(highs), {gain:.09, dur:1.8+Math.random()*.6, timbre:T()});
          break;
        case 1: // ascending pair
          bellNote(pick(mids),  {gain:.08, dur:1.6, timbre:T()});
          bellNote(pick(tops),  {gain:.06, dur:1.3, timbre:T(), t:.08+Math.random()*.08});
          break;
        case 2: // descending pair
          bellNote(pick(tops),  {gain:.07, dur:1.4, timbre:T()});
          bellNote(pick(mids),  {gain:.06, dur:1.6, timbre:T(), t:.06+Math.random()*.06});
          break;
        case 3: // triad quick
          bellNote(pick(mids),  {gain:.06, dur:1.4, timbre:T()});
          bellNote(pick(highs), {gain:.05, dur:1.2, timbre:T(), t:.05});
          bellNote(pick(tops),  {gain:.04, dur:1.0, timbre:T(), t:.11});
          break;
        case 4: // bell + noise sweep (crisp)
          bellNote(pick(highs), {gain:.08, dur:1.5, timbre:T()});
          noiseSweep({gain:.04, dur:.35, fStart:3800, fEnd:1200, t:.02});
          break;
        case 5: // low-pitched soft tap (grounded, less sparkle)
          bellNote(pick(mids),  {gain:.07, dur:1.8, timbre:'tine'});
          bellNote(pick(mids),  {gain:.04, dur:1.5, timbre:'marimba', t:.07});
          break;
      }
      break;
    }
    case 'chord': // chapter label — three-note soft chord
      bellNote(A4, {gain:.07, dur:2.4, timbre:'glass'});
      bellNote(E5, {gain:.06, dur:2.2, t:.03, timbre:'glass'});
      bellNote(C6, {gain:.05, dur:2.0, t:.06, timbre:'bell'});
      noiseSweep({gain:.03, dur:.4, fStart:4000, fEnd:1500, t:.0});
      break;
    case 'strike': // headline — arpeggio w/ bass emphasis
      bellNote(A3, {gain:.10, dur:3.0, timbre:'tine'});
      bellNote(E5, {gain:.09, dur:2.6, t:.04, timbre:'bell'});
      bellNote(A5, {gain:.08, dur:2.4, t:.09, timbre:'bell'});
      bellNote(C6, {gain:.07, dur:2.0, t:.14, timbre:'glass'});
      break;
    case 'swell': // mega / scene change
      bellNote(A3, {gain:.11, dur:3.4, timbre:'tine'});
      bellNote(C5, {gain:.08, dur:3.0, t:.03, timbre:'glass'});
      bellNote(E5, {gain:.08, dur:2.8, t:.06, timbre:'bell'});
      bellNote(A5, {gain:.07, dur:2.6, t:.09, timbre:'bell'});
      bellNote(E6, {gain:.05, dur:2.0, t:.13, timbre:'glass'});
      break;
    case 'low': { // Act III — dissonant/foreboding, 3 random patterns
      const pattern = (Math.random()*3)|0;
      switch(pattern){
        case 0: // minor-2nd clash
          bellNote(A3, {gain:.09, dur:3.0, timbre:'tine'});
          bellNote(A3*1.059, {gain:.05, dur:2.5, t:.08, timbre:'marimba'});
          bellNote(E5, {gain:.06, dur:2.2, t:.04, timbre:'bell'});
          break;
        case 1: // low pluck + hollow mid
          bellNote(A3, {gain:.08, dur:2.6, timbre:'pluck'});
          bellNote(C5, {gain:.05, dur:2.0, t:.06, timbre:'glass'});
          noiseSweep({gain:.03, dur:.5, fStart:1800, fEnd:400, t:.0});
          break;
        case 2: // sparse descending
          bellNote(E5, {gain:.07, dur:2.0, timbre:'bell'});
          bellNote(C5, {gain:.06, dur:2.2, t:.1, timbre:'tine'});
          bellNote(A3, {gain:.05, dur:2.8, t:.22, timbre:'marimba'});
          break;
      }
      break;
    }
  }
}
function pick(arr){ return arr[(arr.length*Math.random())|0]; }

// Context flag — which variant to use for setSub right now
let subVariant = 'soft';

// --- music phase shaping — micro pad, no shimmer ---
let lastMusicPhase = -1;
function updateMusic(e){
  if(!audio.ctx) return;
  const L = audio.layers;
  let phase=0;
  if(e<28) phase=0;
  else if(e<102) phase=1;
  else if(e<218) phase=2;
  else if(e<322) phase=3;
  else phase=4;

  if(phase!==lastMusicPhase){
    lastMusicPhase=phase;
    switch(phase){
      case 0: // hook — barely-there pad
        fadeTo(audio.master, .75, 3);
        fadeTo(L.padGain, .08, 6);
        fadeTo(L.shimmerGain, 0, 1);
        break;
      case 1: // Act I
        fadeTo(L.padGain, .10, 6);
        fadeTo(L.shimmerGain, 0, 1);
        break;
      case 2: // Act II — slight lift
        fadeTo(L.padGain, .12, 6);
        fadeTo(L.shimmerGain, .03, 8);
        break;
      case 3: // Act III — tiny shift, don't change density
        fadeTo(L.padGain, .11, 4);
        fadeTo(L.shimmerGain, 0, 4);
        break;
      case 4:
        fadeTo(audio.master, 0, 10);
        break;
    }
  }
}

function musicTick(){
  if(startAt!=null && audio.ctx){
    updateMusic(elapsed());
  }
  requestAnimationFrame(musicTick);
}
requestAnimationFrame(musicTick);

document.getElementById('play').addEventListener('click',()=>{
  document.getElementById('play').classList.add('hidden');
  initAudio();
  if(audio.ctx && audio.ctx.state==='suspended') audio.ctx.resume();
  startAt=performance.now();
});

// also allow spacebar to pause (jump cues to current time)
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && startAt==null){document.getElementById('play').click();}
});
</script>
